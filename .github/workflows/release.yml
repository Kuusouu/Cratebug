name: Release

on:
    push:
        tags:
            - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing tag to build and release (e.g. 2026.08.27-rc1)'
                required: true

permissions:
    contents: write

concurrency:
    group: release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    resolve:
        name: Resolve release metadata
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.value }}
            prerelease: ${{ steps.tag.outputs.prerelease }}
            productVersion: ${{ steps.tag.outputs.productVersion }}

        steps:
            - name: Resolve tag and version
              id: tag
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  DISPATCH_TAG: ${{ inputs.tag }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  TAG=""
                  if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                      TAG="${DISPATCH_TAG}"
                  else
                      TAG="${REF_NAME}"
                  fi
                  if [[ ! "${TAG}" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(-.+)?$ ]]; then
                      echo "Tag '${TAG}' does not match expected CalVer format" >&2
                      exit 1
                  fi
                  MAJOR=$((10#${BASH_REMATCH[1]}))
                  MINOR=$((10#${BASH_REMATCH[2]}))
                  PATCH=$((10#${BASH_REMATCH[3]}))
                  PRODUCT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
                  PRERELEASE="false"
                  if [[ "${TAG}" == *"-"* ]]; then
                      PRERELEASE="true"
                  fi
                  echo "value=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
                  echo "productVersion=${PRODUCT_VERSION}" >> "$GITHUB_OUTPUT"

    build-windows:
        name: Build Windows
        needs: resolve
        runs-on: windows-2025
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  lfs: true
                  ref: ${{ needs.resolve.outputs.tag }}

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install frontend dependencies
              shell: pwsh
              working-directory: frontend
              run: bun install --frozen-lockfile

            - name: Fetch pinned worker
              shell: pwsh
              run: .\fetch-uassettool.ps1

            - name: Install NSIS
              shell: pwsh
              run: |
                  if (Get-Command choco -ErrorAction SilentlyContinue) {
                      choco install nsis --no-progress -y
                  } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
                      winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements
                  }
                  if (Test-Path "C:\Program Files (x86)\NSIS") {
                      "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  }
                  if (Test-Path "C:\Program Files\NSIS") {
                      "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  }

            - name: Set installer version metadata
              shell: pwsh
              env:
                  PRODUCT_VERSION: ${{ needs.resolve.outputs.productVersion }}
              run: |
                  $wailsConfig = Get-Content wails.json -Raw | ConvertFrom-Json
                  $wailsConfig.info.productVersion = $env:PRODUCT_VERSION
                  $wailsConfig | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

            - name: Build Windows application and installer
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
              run: |
                  $tag = $env:RELEASE_TAG
                  go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build `
                      -clean -platform windows/amd64 -nsis -installscope user -nocolour `
                      -ldflags "-X main.AppVersion=$tag"
                  if ($LASTEXITCODE -ne 0) {
                      throw "wails build failed with exit code $LASTEXITCODE."
                  }
                  if (-not (Test-Path "build/bin/Cratebug-amd64-installer.exe")) {
                      throw "Wails did not produce build/bin/Cratebug-amd64-installer.exe"
                  }

            - name: Upload Windows installer
              uses: actions/upload-artifact@v4
              with:
                  name: windows-installer
                  path: build/bin/Cratebug-amd64-installer.exe
                  if-no-files-found: error

    build-linux:
        name: Build Linux
        needs: resolve
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  lfs: true
                  ref: ${{ needs.resolve.outputs.tag }}

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install frontend dependencies
              working-directory: frontend
              run: bun install --frozen-lockfile

            - name: Fetch pinned worker
              run: bash ./fetch-uassettool.sh

            - name: Build Linux AppImage
              env:
                  APP_VERSION: ${{ needs.resolve.outputs.tag }}
              run: bash ./build-linux.sh

            - name: Upload Linux AppImage
              uses: actions/upload-artifact@v4
              with:
                  name: linux-appimage
                  path: build/bin/Cratebug-x86_64.AppImage
                  if-no-files-found: error

    publish:
        name: Publish release
        needs: [resolve, build-windows, build-linux]
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ needs.resolve.outputs.tag }}

            - name: Download Windows installer
              uses: actions/download-artifact@v4
              with:
                  name: windows-installer
                  path: release-assets/

            - name: Download Linux AppImage
              uses: actions/download-artifact@v4
              with:
                  name: linux-appimage
                  path: release-assets/

            - name: Extract changelog section
              id: notes
              shell: bash
              env:
                  RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
              run: |
                  TAG="${RELEASE_TAG}"
                  IN_SECTION=0
                  NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
                  rm -f "${NOTES_FILE}"
                  while IFS= read -r line; do
                      if [[ "${line}" =~ ^##\ \[ ]]; then
                          if [ "${IN_SECTION}" -eq 1 ]; then
                              break
                          fi
                          if [[ "${line}" == "## [${TAG}]" ]]; then
                              IN_SECTION=1
                          fi
                          continue
                      fi
                      if [ "${IN_SECTION}" -eq 1 ]; then
                          echo "${line}" >> "${NOTES_FILE}"
                      fi
                  done < CHANGELOG.md

                  if [ ! -f "${NOTES_FILE}" ] || [ ! -s "${NOTES_FILE}" ]; then
                      echo "CHANGELOG.md has no '## [${TAG}]' section." >&2
                      exit 1
                  fi
                  echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

            - name: Create GitHub release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
                  RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
              run: |
                  TAG="${RELEASE_TAG}"
                  ARGS=(
                      release create "${TAG}"
                      release-assets/Cratebug-amd64-installer.exe
                      release-assets/Cratebug-x86_64.AppImage
                      --title "Cratebug ${TAG}"
                      --notes-file "${{ steps.notes.outputs.path }}"
                  )
                  if [ "${RELEASE_PRERELEASE}" = "true" ]; then
                      ARGS+=(--prerelease)
                  fi
                  gh "${ARGS[@]}"
